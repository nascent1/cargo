<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="brandGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Baground Circle -->
    <circle cx="256" cy="256" r="240" fill="#0f172a" />
    
    <!-- Crossed Tools -->
    <g transform="translate(256, 256) rotate(45) translate(-256, -256)" filter="url(#shadow)">
        <!-- Wrench -->
        <path d="M190 130 C 160 160, 160 210, 190 240 L 150 280 L 180 310 L 220 270 C 250 300, 300 300, 330 270 L 360 240 L 330 210 L 190 130 Z" fill="url(#brandGradient)" />
        <rect x="236" y="100" width="40" height="312" rx="20" fill="#e2e8f0" transform="rotate(-90 256 256)" />
    </g>
    
    <!-- Initial F -->
    <path d="M180 160 L 332 160 L 332 200 L 220 200 L 220 230 L 310 230 L 310 270 L 220 270 L 220 352 L 180 352 Z" fill="#ffffff" transform="translate(0, 20)" opacity="0.9"/>
